<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buttons & Forms — Warshat Fan</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { padding: 2rem; max-width: 720px; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    h2 { font-size: 0.95rem; margin: 1.75rem 0 0.75rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    .form { display: flex; flex-direction: column; gap: 1rem; max-width: 420px; }
  </style>
</head>
<body>
  <h1 data-od-id="btn-title">Buttons · Badges · Forms</h1>

  <h2>Buttons</h2>
  <div class="row" data-od-id="btn-row">
    <button class="btn btn-primary">إضافة ورشة</button>
    <button class="btn btn-primary btn-sm">صغير</button>
    <button class="btn btn-ghost">إلغاء</button>
    <button class="btn btn-danger">حذف</button>
  </div>

  <h2>Badges</h2>
  <div class="row" data-od-id="badge-row">
    <span class="badge badge-orange">ورشة عمل</span>
    <span class="badge badge-beige">نشاط مفتوح</span>
    <span class="badge badge-green">مجاني</span>
    <span class="badge badge-red">غير نشط</span>
  </div>

  <h2>Form controls</h2>
  <form class="form" data-od-id="form-demo" onsubmit="return false">
    <div class="form-group">
      <label class="form-label">عنوان الورشة (عربي)</label>
      <input class="form-input" value="ورشة الفخار" />
    </div>
    <div class="form-group">
      <label class="form-label">التصنيف</label>
      <select class="form-select">
        <option>ورشة عمل</option>
        <option>نشاط مفتوح</option>
        <option>أطفال</option>
        <option>دورة</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">الوصف</label>
      <textarea class="form-textarea">تعلّم أساسيات تشكيل الفخار في فرع الزيونة.</textarea>
    </div>
    <div class="row">
      <button class="btn btn-primary" type="submit">حفظ</button>
      <button class="btn btn-ghost" type="button">رجوع</button>
    </div>
  </form>
</body>
</html>
