<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ورشة فن — Poster</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #2a2418; padding: 24px; }
    .poster {
      width: min(480px, 100%);
      aspect-ratio: 3/4;
      background: var(--clr-bg);
      border: 1px solid var(--clr-border);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .blob { position: absolute; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
    .logo { height: 64px; width: auto; position: relative; z-index: 2; }
    h1 { font-size: clamp(2.4rem, 8vw, 3.4rem); color: var(--clr-heading); line-height: 1.15; margin: 28px 0 12px; position: relative; z-index: 2; }
    .tag { color: var(--clr-coral); font-family: var(--font-heading); font-size: 1.4rem; position: relative; z-index: 2; }
    .meta { margin-top: auto; position: relative; z-index: 2; border-top: 4px solid var(--clr-honey); padding-top: 18px; }
    .meta p { margin: 0; color: var(--clr-text-muted); font-size: 1rem; }
    .branches { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <article class="poster" data-od-id="poster">
    <span class="blob" style="top:-30px;left:-40px;width:160px;height:160px;background:#ABC175;opacity:.55"></span>
    <span class="blob" style="bottom:80px;right:-50px;width:180px;height:140px;background:#f3ddd4"></span>
    <img class="logo" src="../../assets/logo.png" alt="ورشة فن" />
    <h1>تعال<br />اصنع<br />شيئاً جميلاً</h1>
    <div class="tag">مساحة الإبداع والتعلم</div>
    <div class="meta">
      <p>ورش · نشاطات مفتوحة · دورات أطفال</p>
      <div class="branches">
        <span class="badge badge-beige">الزيونة</span>
        <span class="badge badge-beige">اليرموك</span>
      </div>
    </div>
  </article>
</body>
</html>
